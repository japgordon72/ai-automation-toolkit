<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Dashboard - AI/Automation Signals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes progressFill {
            from {
                width: 0;
            }
            to {
                width: var(--progress-width);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(139, 92, 246, 0.4);
            }
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 50px;
            animation: slideInLeft 0.8s ease;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 24px;
            gap: 20px;
        }

        .stats-row {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 24px;
            border-radius: 12px;
            animation: fadeIn 0.8s ease 0.1s backwards;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 8px;
            color: #60a5fa;
        }

        .signal {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeIn 0.6s ease;
            animation-fill-mode: backwards;
            position: relative;
            overflow: hidden;
        }

        .signal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .signal:hover::before {
            left: 100%;
        }

        .signal:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(59, 130, 246, 0.15);
        }

        .signal:nth-child(1) { animation-delay: 0.1s; }
        .signal:nth-child(2) { animation-delay: 0.2s; }
        .signal:nth-child(3) { animation-delay: 0.3s; }
        .signal:nth-child(4) { animation-delay: 0.4s; }
        .signal:nth-child(5) { animation-delay: 0.5s; }
        .signal:nth-child(6) { animation-delay: 0.6s; }
        .signal:nth-child(n+7) { animation-delay: 0.7s; }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 12px;
        }

        .signal-title {
            font-size: 18px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 8px;
            flex: 1;
            line-height: 1.4;
        }

        .signal-source {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .signal-description {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .signal-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .metric-label {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 4px;
            animation: progressFill 1.2s ease-out;
        }

        .metric-value {
            color: #60a5fa;
            font-weight: 700;
            font-size: 14px;
        }

        .signal-footer {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .signal-link {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            border: none;
            cursor: pointer;
        }

        .signal-link:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        .signals-container {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 28px;
            color: #f1f5f9;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(59, 130, 246, 0.2);
            animation: slideInLeft 0.8s ease 0.2s backwards;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            padding-top: 40px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            animation: fadeIn 0.8s ease 0.8s backwards;
        }

        .no-signals {
            text-align: center;
            color: #94a3b8;
            padding: 60px 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .signal {
                padding: 18px;
            }

            .signal-metrics {
                grid-template-columns: 1fr;
            }

            .header-meta {
                flex-direction: column;
                align-items: flex-start;
            }

            .stat-card {
                flex: 1;
                min-width: 120px;
            }

            .signal-header {
                flex-direction: column;
            }

            .signal-source {
                margin-left: 0;
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Signal Dashboard</h1>
            <div class="header-meta">
                <span>AI & Automation Signals for Builders</span>
                <span>Updated: {{ TIMESTAMP }}</span>
            </div>
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value">50+</div>
                    <div class="stat-label">Signals Fetched</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">4</div>
                    <div class="stat-label">Data Sources</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">Real-time</div>
                    <div class="stat-label">Updates</div>
                </div>
            </div>
        </header>

        <div class="signals-container">
            <div class="section-title">Today's Top Signals</div>
            {{ SIGNALS }}
        </div>

        <footer>
            <p>Signal Dashboard • AI/Automation trend detection for content creators and builders</p>
            <p>Updated: {{ TIMESTAMP }}</p>
        </footer>
    </div>
</body>
</html>
